name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, with or without a leading v (for example 0.1.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Gate, tag, and publish release
    runs-on: macos-15
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode_path"
          swift --version

      - name: Validate the requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a semantic version (major.minor.patch with optional prerelease): ${REQUESTED_VERSION}" >&2
            exit 1
          fi
          tag="v${version}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists; pick the next version instead." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse versions shadowed by other tags in the same major range
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PYTHON'
          import re
          import subprocess
          import sys

          requested = sys.argv[1]

          def parse(text):
              match = re.fullmatch(
                  r"v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?", text)
              if match is None:
                  return None
              major, minor, patch, prerelease = match.groups()
              core = (int(major), int(minor), int(patch))
              identifiers = tuple(prerelease.split(".")) if prerelease else ()
              return (core, identifiers)

          def compare_identifiers(left, right):
              if not left and right:
                  return 1
              if left and not right:
                  return -1
              for one, two in zip(left, right):
                  one_numeric, two_numeric = one.isdigit(), two.isdigit()
                  if one_numeric and two_numeric:
                      first, second = int(one), int(two)
                  elif one_numeric:
                      first, second = 0, 1
                  elif two_numeric:
                      first, second = 1, 0
                  else:
                      first, second = (one, two)
                  if first != second:
                      return -1 if first < second else 1
              if len(left) != len(right):
                  return -1 if len(left) < len(right) else 1
              return 0

          def compare(candidate, other):
              if candidate[0] != other[0]:
                  return -1 if candidate[0] < other[0] else 1
              return compare_identifiers(candidate[1], other[1])

          requested_version = parse(requested)
          if requested_version is None:
              print(f"::error::{requested} did not parse as a semantic version", file=sys.stderr)
              sys.exit(1)

          tags = subprocess.run(
              ["git", "tag", "--list"],
              capture_output=True, text=True, check=True).stdout.split()

          upper_bound = (requested_version[0][0] + 1, 0, 0)
          shadows = []
          for tag in tags:
              parsed = parse(tag)
              if parsed is None:
                  continue
              if parsed[0] >= upper_bound:
                  continue
              if compare(parsed, requested_version) >= 0:
                  shadows.append(tag)

          if shadows:
              listed = ", ".join(sorted(shadows))
              print(
                  f"::error::Version v{requested} would be shadowed within its major range "
                  f"by existing tags: {listed}. Consumers using range requirements such as "
                  f'from: "0.1.0" would resolve to the higher tag instead of this release. '
                  "Delete or rename the shadowing tags before releasing.",
                  file=sys.stderr)
              sys.exit(1)
          PYTHON

      - name: Build every product
        run: swift build

      - name: Run the SwiftGodotRuntime tests
        run: swift test --filter SwiftGodotRuntimeTests

      - name: Tag the release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --latest
