version: "3"

vars:
  SWIFTGODOT: '{{.SWIFTGODOT | default "../SwiftGodot"}}'
  CUSTOM_GODOT: '{{.CUSTOM_GODOT | default "../../custom-godot"}}'
  GODOT: '{{.GODOT | default (printf "%s/godot" .CUSTOM_GODOT)}}'
  OUTPUT: '{{.OUTPUT | default "build"}}'
  LIBGODOT_SDK_LOCK: '{{.LIBGODOT_SDK_LOCK | default "config/libgodot-sdk.json"}}'
  LIBGODOT_SDK: '{{.LIBGODOT_SDK | default (printf "%s/custom-godot-sdk" .OUTPUT)}}'
  RELEASE_REPO: '{{.RELEASE_REPO | default "cafecito-games/SwiftGodotKit"}}'
  GODOT_REPO: '{{.GODOT_REPO | default "cafecito-games/custom-godot"}}'
  JOBS:
    sh: sysctl -n hw.logicalcpu 2>/dev/null || echo 8

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the SwiftGodotKit library against Cafecito SwiftGodot
    cmds:
      - swift build --target SwiftGodotKit

  build:sample:
    desc: Build the bundled TrivialSample executable
    cmds:
      - swift build --product TrivialSample

  test:runtime:
    desc: Verify the SwiftGodotRuntime boundary (unit tests plus the headless fixture)
    cmds:
      - swift test --filter SwiftGodotRuntimeTests
      - task: test:runtime:fixture

  test:runtime:fixture:
    desc: Build and run the headless fixture through only the SwiftGodotRuntime product
    dir: RuntimeExample
    cmds:
      - cmd: |
          set -o pipefail
          mkdir -p build
          swift package clean
          swift build --product RuntimeExample --verbose 2>&1 | tee build/runtime-fixture-build.log
          if grep -q 'Sources/SwiftGodotKit/' build/runtime-fixture-build.log; then
            echo "error: the headless fixture build compiled SwiftGodotKit UI sources" >&2
            exit 1
          fi
          if ! grep -q 'Sources/SwiftGodotRuntime/' build/runtime-fixture-build.log; then
            echo "error: the headless fixture build log records no SwiftGodotRuntime compilation" >&2
            exit 1
          fi
      - swift run RuntimeExample

  compatibility:check:
    desc: Check that the selected forks expose the APIs required by SwiftGodotKit
    silent: true
    env:
      SWIFTGODOT_DIR: "{{.SWIFTGODOT}}"
      GODOT_DIR: "{{.GODOT}}"
    cmds:
      - scripts/check-fork-compatibility

  compatibility:sdk:
    desc: Check Cafecito SwiftGodot against the locked published custom-Godot SDK
    silent: true
    env:
      SWIFTGODOT_DIR: "{{.SWIFTGODOT}}"
      GODOT_DIR: "{{.LIBGODOT_SDK}}"
      LIBGODOT_SDK_LOCK: "{{.LIBGODOT_SDK_LOCK}}"
    cmds:
      - scripts/check-fork-compatibility

  payload:fetch:
    desc: Download and verify the locked custom-Godot Apple LibGodot SDK
    cmds:
      - scripts/fetch-custom-godot-sdk "{{.LIBGODOT_SDK_LOCK}}" "{{.LIBGODOT_SDK}}"

  payload:package:
    desc: Package the locked custom-Godot SDK into Apple XCFrameworks
    cmds:
      - LIBGODOT_SDK_LOCK="{{.LIBGODOT_SDK_LOCK}}" scripts/make-libgodot.xcframework --configuration release "{{.SWIFTGODOT}}" "{{.LIBGODOT_SDK}}" "{{.OUTPUT}}"

  payload:build:
    desc: Build release libgodot slices from a custom-Godot source checkout
    cmds:
      - scripts/make-libgodot.xcframework --build --configuration release --zip --jobs "{{.JOBS}}" "{{.SWIFTGODOT}}" "{{.GODOT}}" "{{.OUTPUT}}"

  payload:release:
    desc: Fetch the approved SDK and create release XCFramework payloads
    cmds:
      - task: payload:fetch
        vars:
          LIBGODOT_SDK_LOCK: "{{.LIBGODOT_SDK_LOCK}}"
          LIBGODOT_SDK: "{{.LIBGODOT_SDK}}"
      - task: compatibility:sdk
        vars:
          SWIFTGODOT: "{{.SWIFTGODOT}}"
          LIBGODOT_SDK_LOCK: "{{.LIBGODOT_SDK_LOCK}}"
          LIBGODOT_SDK: "{{.LIBGODOT_SDK}}"
      - LIBGODOT_SDK_LOCK="{{.LIBGODOT_SDK_LOCK}}" scripts/make-libgodot.xcframework --configuration release --zip "{{.SWIFTGODOT}}" "{{.LIBGODOT_SDK}}" "{{.OUTPUT}}"

  payload:debug:
    desc: Build and package debug libgodot slices
    cmds:
      - scripts/make-libgodot.xcframework --build --configuration debug --zip --jobs "{{.JOBS}}" "{{.SWIFTGODOT}}" "{{.GODOT}}" "{{.OUTPUT}}"

  payload:zip:
    desc: Zip existing release XCFrameworks and print SwiftPM checksums
    cmds:
      - LIBGODOT_SDK_LOCK="{{.LIBGODOT_SDK_LOCK}}" scripts/make-libgodot.xcframework --configuration release --zip "{{.SWIFTGODOT}}" "{{.LIBGODOT_SDK}}" "{{.OUTPUT}}"

  release:publish:
    desc: Publish existing payload zips and update Package.swift; set VERSION
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "Set VERSION, for example: task release:publish VERSION=v0.1.0-libgodot.1"
    env:
      RELEASE_PRERELEASE: '{{.RELEASE_PRERELEASE | default "0"}}'
    cmds:
      - scripts/publish-libgodot-release "{{.VERSION}}" "{{.LIBGODOT_SDK}}" "{{.LIBGODOT_SDK_LOCK}}" "{{.OUTPUT}}" Package.swift "{{.RELEASE_REPO}}" "{{.GODOT_REPO}}"

  release:
    desc: Build, package, and publish libgodot payloads; set VERSION
    preconditions:
      - sh: test -n "{{.VERSION}}"
        msg: "Set VERSION, for example: task release VERSION=v0.1.0-libgodot.1"
    cmds:
      - task: payload:release
        vars:
          SWIFTGODOT: "{{.SWIFTGODOT}}"
          OUTPUT: "{{.OUTPUT}}"
          LIBGODOT_SDK_LOCK: "{{.LIBGODOT_SDK_LOCK}}"
          LIBGODOT_SDK: "{{.LIBGODOT_SDK}}"
      - task: release:publish
        vars:
          VERSION: "{{.VERSION}}"
          LIBGODOT_SDK_LOCK: "{{.LIBGODOT_SDK_LOCK}}"
          LIBGODOT_SDK: "{{.LIBGODOT_SDK}}"
          OUTPUT: "{{.OUTPUT}}"
          RELEASE_REPO: "{{.RELEASE_REPO}}"
          GODOT_REPO: "{{.GODOT_REPO}}"
          RELEASE_PRERELEASE: '{{.RELEASE_PRERELEASE | default "0"}}'

  sample:
    desc: Generate the Axolotl sample project and its PCK
    dir: Samples/AxolotlDemo
    cmds:
      - task

  sample:macos:
    desc: Build the Axolotl sample for macOS
    dir: Samples/AxolotlDemo
    cmds:
      - task build:macos

  sample:ios-simulator:
    desc: Build the Axolotl sample for the iOS Simulator
    dir: Samples/AxolotlDemo
    cmds:
      - task build:ios-simulator

